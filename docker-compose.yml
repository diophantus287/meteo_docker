services:
  meteo-files:
    build: .
    container_name: meteo-files
    volumes:
      - ./web:/app
    networks:
      - web
    ports:
      - "8084:5000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meteo-files.rule=Host(`meteo.warein.me`)"
      - "traefik.http.routers.meteo-files.entrypoints=web"
      - "traefik.http.routers.meteo-files.tls.certresolver=myresolver"
      - "traefik.http.services.meteo-files.loadbalancer.server.port=5000"

  ens-batch:
    build:
      context: .
      dockerfile: Dockerfile.batch
    container_name: ens-batch
    restart: unless-stopped
    # Shares the same plots folder as the web container.
    volumes:
      - ./web/static/plots:/plots
    # No network access needed beyond outbound HTTPS to ECMWF open-data servers.
    environment:
      - ENS_OUTPUT=/plots/ens_meteogram.png

networks:
  web:
    external: true
