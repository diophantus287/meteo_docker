<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ECMWF Meteogramas</title>
  <meta http-equiv="refresh" content="300">
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 20px;
    }

    nav {
      margin-bottom: 14px;
    }

    h1 {
      margin-bottom: 18px;
    }

    .btn-volver {
      display: inline-block;
      margin: 6px 0 18px 0;
      padding: 10px 16px;
      background: #1f6feb;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
    }

    .btn-volver:hover {
      filter: brightness(0.95);
    }

    /* Contenedor ancho */
    .wrap {
      max-width: 1700px;
      margin: 0 auto;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      background: #fff;
      margin-bottom: 24px;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 1.1rem;
    }

    /* Imagen grande, a todo el ancho */
    .card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }

    .meta {
      margin-top: 6px;
      font-size: .85rem;
      color: #666;
    }

    .empty {
      color: #666;
    }
  </style>
</head>
<body>

  

  <div class="wrap">
    <h1>Meteogramas ECMWF ENS</h1>

    <p>
      <a class="btn-volver" href="/">Volver</a>
    </p>

    {% if meteogramas and meteogramas|length > 0 %}
      {% for m in meteogramas %}
        <div class="card">
          <h3>{{ m.label }}</h3>
          <img src="{{ m.url }}" alt="Meteograma {{ m.label }}">
          <div class="meta">{{ m.file }}</div>
        </div>
      {% endfor %}
    {% else %}
      <p class="empty">No hay meteogramas en <code>web/static/ecmwf</code>.</p>
    {% endif %}
  </div>
</body>
</html>
