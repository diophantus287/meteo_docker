<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ECMWF Meteogramas Simple</title>
  <meta http-equiv="refresh" content="300">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      margin-bottom: 18px;
    }

    .btn {
      display: inline-block;
      margin: 6px 8px 18px 0;
      padding: 10px 16px;
      background: #1f6feb;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
    }

    .btn:hover {
      filter: brightness(0.95);
    }

    .wrap {
      max-width: 1700px;
      margin: 0 auto;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      background: #fff;
      margin-bottom: 24px;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 1.1rem;
    }

    .card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }

    .meta {
      margin-top: 6px;
      font-size: .85rem;
      color: #666;
    }

    .empty {
      color: #666;
    }

    @media (max-width: 768px) {
      body {
        margin: 0;
      }

      .wrap {
        padding: 0;
      }

      .card {
        border-left: 0;
        border-right: 0;
        border-radius: 0;
      }

      h1, .btn {
        margin-left: 12px;
        margin-right: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <h1>Meteogramas ECMWF ENS (Simple)</h1>

    <p>
      <a class="btn" href="/">Volver</a>
      <a class="btn" href="/ecmwf">Ver ECMWF</a>
    </p>

    {% if meteogramas and meteogramas|length > 0 %}
      {% for m in meteogramas %}
        <div class="card">
          <h3>{{ m.label }}</h3>
          <img src="{{ m.url }}" alt="Meteograma simple {{ m.label }}">
          <div class="meta">{{ m.file }}</div>
        </div>
      {% endfor %}
    {% else %}
      <p class="empty">No hay meteogramas en <code>web/static/ecmwf_simple</code>.</p>
    {% endif %}
  </div>
</body>
</html>
