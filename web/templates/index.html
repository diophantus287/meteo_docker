<!DOCTYPE html>
<html>
<head>
    <title>Meteo Plots</title>
    <meta http-equiv="refresh" content="300">
    <style>
        .btn-ecmwf {
            display: inline-block;
            margin: 12px 0;
            padding: 10px 16px;
            background: #1f6feb;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
        }
        .btn-ecmwf:hover {
            filter: brightness(0.95);
        }

        /* Evita que se monten */
        .plot-img {
            display: block;
            width: 600px;
            max-width: 100%;
            height: auto;
            margin: 0 0 18px 0;
        }
    </style>
</head>
<body>

    

    <h1>Predicciones y temperaturas</h1>

    <p>
        <a class="btn-ecmwf" href="/ecmwf">Ver plots ECMWF</a>
    </p>

    {% for plot in plots %}
        <!--<h2>{{ plot }}</h2>-->
        <img
            class="plot-img"
            src="{{ url_for('static', filename='plots/' + plot) }}?v={{ cache_id }}"
            alt="{{ plot }}"
        >
    {% endfor %}

</body>
</html>
