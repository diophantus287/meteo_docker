name: ENS Meteogram Builder

on:
  schedule:
    # Run twice daily: catches the 00z run (~07:30 UTC) and the 12z run (~19:30 UTC)
    - cron: '30 7 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch:   # allow manual trigger from the GitHub Actions UI

permissions:
  contents: write

jobs:
  build-ens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system libraries (eccodes)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes-dev

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Build ENS meteogram
        run: python scripts/build_ens_meteogram.py

      - name: Commit and push artifacts (if changed)
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add web/data/ens_salamanca.csv web/data/ens_meteograma.json web/static/plots/ens_meteograma.png
          git diff --cached --quiet \
            && echo "No artifact changes — nothing to commit." \
            || (git commit -m "chore: update ENS meteogram artifacts [skip ci]" && git push)
